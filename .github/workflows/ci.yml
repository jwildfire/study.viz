name: CI

# The required check on dev is the one job below, which carries the name the
# ruleset asks for: "Build, format, and test". It mirrors the shape of
# safety.viz's check, cut to what study.viz has: one job, every step of which
# must pass. safety.viz splits its check across four jobs to answer sooner; if
# this one grows slow, split it the same way, behind a gate job that carries
# the name (the developer guidelines, "A required check split across jobs").
#
# tests/unit/repo/ci-workflow.test.js reads this file and fails unless the job
# keeps the shape that makes it safe to require. CONTRIBUTING.md, "How the
# check is laid out", says what it is for. Change both with this file.

on:
  pull_request:
    # Explicit types so a draft marked ready for review is checked; the default
    # set (opened, synchronize, reopened) would leave that transition untested.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, format, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # The demo app, its tests and what they read were copied from one commit
      # of safety.viz: every copied file must match the record, SOURCE.json,
      # and the record must be the one scripts/copied-lib.mjs declares.
      - name: Files copied from safety.viz match their record
        run: npm run copied:check

      # safety.viz's charts are its built bundle, copied with a record: the
      # copy must match the record, and src/data/portfolio.json must be the
      # chart list the bundle exports.
      - name: Copied safety.viz bundle matches its record
        run: npm run safety-viz:check

      # The libraries the app carries are copied from their own repositories,
      # each with a record beside it. Each step fails if a copy and its record
      # disagree; none needs the network. The `:check-source` script of the
      # same name also reads the source repository, and is run by hand.
      - name: Copied bio.viz bundle matches its record
        run: npm run bio-viz:check

      - name: Copied gsm.bio statistics file matches its record
        run: npm run statistics:check

      - name: The gsm packages built for R in the browser match their record and pins
        run: npm run r-wasm:check

      - name: Copied gsm workflows match their records
        run: npm run gsm-workflows:check

      - name: Copied gsm.viz bundle matches its record
        run: npm run gsm-viz:check

      - name: Copied RBQM demo study matches its record
        run: npm run rbqm-study:check

      - name: Copied study.builder matches its record
        run: npm run study-builder:check

      - name: Run unit tests
        run: npm test

      # The site is the demo app, as its root page. The build fails on a broken
      # internal link.
      - name: Build the site (link validation)
        run: npm run site

      # The app bundle and the single file that opens from disk.
      - name: Build the app bundle and the single file
        run: npm run build:app

      # With its system packages, as the screenshot baselines were written.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Every browser test, the ones that start real R among them: they
      # download R from its public hosts. On this runner each captured
      # screenshot is compared with its baseline in docs/evidence/basic-app/.
      - name: Run browser tests
        run: npm run test:e2e -- --project=chromium
